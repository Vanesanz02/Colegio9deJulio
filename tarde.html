<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Tecnología Semanal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-6">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center">
            <!-- 🤫 TRIPLE CLIC AQUÍ PARA REINICIAR -->
            <h1 id="tituloSecreto" class="text-3xl font-bold text-blue-800 cursor-pointer select-none">
                Reserva de Recursos - Turno Tarde
            </h1>
            <p class="text-gray-600 mt-2">Módulos compartidos en tiempo real (Stock Diario: 8 PCs y 3 TVs).</p>
            
            <button id="btnLimpiarSemana" class="hidden mt-4 px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold text-xs rounded shadow uppercase tracking-wider transition mx-auto">
                🔄 Reiniciar Toda la Semana (Admin)
            </button>
        </header>

        <!-- CONTENEDOR DE DÍAS DE LA SEMANA -->
        <div id="contenedorSemana" class="space-y-6">
            <!-- Los días se dibujan aquí dinámicamente -->
        </div>
    </div>

    <!-- VENTANA FLOTANTE (MODAL) -->
    <div id="miModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden p-4">
        <div class="bg-white p-6 rounded-lg shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
            <h3 id="modalTitulo" class="text-xl font-bold text-blue-800 mb-2">Gestionar Módulo</h3>
            
            <div class="mb-4 bg-gray-50 p-3 rounded border">
                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Reservas actuales en este turno:</h4>
                <div id="listaReservasActuales" class="space-y-2 text-sm text-gray-800"></div>
            </div>

            <hr class="mb-4">

            <form id="formReserva">
                <h4 class="text-sm font-bold text-gray-700 mb-3">➕ Cargar nueva reserva:</h4>
                
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Curso:</label>
                    <select id="inputCurso" required class="w-full border rounded p-2 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Seleccionar curso...</option>
                        <option value="1° Año">1° Año</option>
                        <option value="2° Año">2° Año</option>
                        <option value="3° Año">3° Año</option>
                        <option value="4° Año">4° Año</option>
                        <option value="5° Año">5° Año</option>
                        <option value="6° Año">6° Año</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">División / Orientación:</label>
                    <select id="inputDivision" required class="w-full border rounded p-2 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Seleccionar división...</option>
                        <option value="Primera">Primera</option>
                        <option value="Segunda">Segunda</option>
                        <option value="Economía">Economía</option>
                        <option value="Sociales">Sociales</option>
                        <option value="Naturales">Naturales</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Recurso a solicitar:</label>
                    <select id="recursoSelect" required class="w-full border rounded p-2 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500"></select>
                </div>

                <div class="flex justify-end space-x-3">
                    <button id="btnCancelar" type="button" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded font-medium transition text-sm">Cerrar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium transition shadow text-sm">Confirmar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGICA DE FIREBASE SEMANAL -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-XIndnyFhGJ-yclitDPM_uKpMix2m0aM",
            authDomain: "reservas-escuela-tarde.firebaseapp.com",
            databaseURL: "https://reservas-escuela-tarde-default-rtdb.firebaseio.com",
            projectId: "reservas-escuela-tarde",
            storageBucket: "reservas-escuela-tarde.firebasestorage.app",
            messagingSenderId: "361019783061",
            appId: "1:361019783061:web:22adb6f1c1d7beac40e89c",
            measurementId: "G-88KEYWRKE1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🎯 CAMBIO DE STOCK AQUI (8 PCs):
        const STOCK_MAX_PC = 8;
        const STOCK_MAX_TV = 3;
        const DIAS = ["lunes", "martes", "miercoles", "jueves", "viernes"];
        const MODULOS = ["modulo1", "modulo2", "modulo3"];

        let diaActual = "";
        let moduloActual = "";
        let estadoGlobalSemana = {};

        // 📅 DETECTAR DÍA ACTUAL REAL (0=Dom, 1=Lun, 2=Mar, 3=Mie, 4=Jue, 5=Vie, 6=Sab)
        const numeroDiaHoy = new Date().getDay(); 

        // 🛠️ DIBUJAR LA ESTRUCTURA VISUAL BASE (Todos se crean vivos al inicio)
        const contenedor = document.getElementById("contenedorSemana");
        DIAS.forEach((dia, index) => {
            const numeroDiaContenedor = index + 1;
            // Evaluamos si el día ya pasó
            const diaYaPaso = numeroDiaHoy >= 1 && numeroDiaHoy <= 5 && numeroDiaContenedor < numeroDiaHoy;

            let modulosHtml = "";
            MODULOS.forEach(mod => {
                const numMod = mod === "modulo1" ? "1° Módulo" : mod === "modulo2" ? "2° Módulo" : "3° Módulo";
                
                // Ponemos los IDs contenedores para que Firebase les inyecte los textos después
                modulosHtml += `
                    <div id="card-${dia}-${mod}" class="border-2 p-4 rounded-lg transition shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span id="titulo-mod-${dia}-${mod}" class="font-bold">${numMod}</span>
                            <span id="badge-${dia}-${mod}" class="text-xs px-2 py-0.5 rounded-full font-semibold">Cargando...</span>
                        </div>
                        <div id="info-${dia}-${mod}" class="space-y-1 text-sm">
                            <!-- Aquí se van a ver los cursos -->
                        </div>
                    </div>
                `;
            });

            contenedor.innerHTML += `
                <div id="box-dia-${dia}" class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600">
                    <h2 id="head-dia-${dia}" class="text-2xl font-bold mb-4 border-b pb-2 uppercase flex items-center justify-between">
                        <span>📅 ${dia}</span>
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${modulosHtml}</div>
                </div>
            `;
        });

        // 👁️ ESCUCHAR LA BASE DE DATOS Y ENLAZAR LOS ESTILOS (BLOQUEADOS VS COMPLETO)
        onValue(ref(db, "reservas"), (snapshot) => {
            const data = snapshot.val() || {};
            estadoGlobalSemana = data;

            DIAS.forEach((dia, index) => {
                const numeroDiaContenedor = index + 1;
                // 🎯 REGLA DE BLOQUEO POR FECHA REAL
                const diaYaPaso = numeroDiaHoy >= 1 && numeroDiaHoy <= 5 && numeroDiaContenedor < numeroDiaHoy;
                
                // Estilos para el contenedor del día entero si ya venció
                const boxDia = document.getElementById(`box-dia-${dia}`);
                const headDia = document.getElementById(`head-dia-${dia}`);
                if (diaYaPaso) {
                    boxDia.className = "bg-white p-6 rounded-lg shadow-sm border-t-4 border-gray-300 bg-gray-50 opacity-80";
                    headDia.className = "text-2xl font-bold text-gray-400 mb-4 border-b pb-2 uppercase flex items-center justify-between";
                    if (!headDia.innerHTML.includes("Inhabilitado")) {
                        headDia.innerHTML += '<span class="text-xs bg-gray-200 text-gray-500 font-normal px-2 py-1 rounded-sm normal-case tracking-normal">Inhabilitado (Paso)</span>';
                    }
                } else {
                    boxDia.className = "bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600";
                    headDia.className = "text-2xl font-bold text-gray-800 mb-4 border-b pb-2 uppercase flex items-center justify-between";
                }

                MODULOS.forEach(mod => {
                    const card = document.getElementById(`card-${dia}-${mod}`);
                    const badge = document.getElementById(`badge-${dia}-${mod}`);
                    const info = document.getElementById(`info-${dia}-${mod}`);
                    const txtTitulo = document.getElementById(`titulo-mod-${dia}-${mod}`);
                    if (!card) return;
                    
                    let pcsUsadas = 0;
                    let tvsUsadas = 0;
                    let renglonesHtml = "";

                    // Traer los datos reales guardados sin importar si está gris o no
                    if (data[dia] && data[dia][mod]) {
                        Object.keys(data[dia][mod]).forEach(key => {
                            const res = data[dia][mod][key];
                            if (!res || !res.curso || !res.tipo) return;

                            if (res.tipo === "PC") pcsUsadas += res.cantidad || 0;
                            if (res.tipo === "TV") tvsUsadas += res.cantidad || 0;
                            
                            renglonesHtml += `<p class="truncate">🔹 <b>${res.curso} ${res.division || ''}:</b> ${res.cantidad} ${res.tipo}</p>`;
                        });
                    }

                    let pcsLibres = STOCK_MAX_PC - pcsUsadas;
                    let tvsLibres = STOCK_MAX_TV - tvsUsadas;

                    // ASIGNACIÓN DE ESTILOS DEPENDIENDO DE SI YA PASÓ EL DÍA O SIGUE ACTIVO
                    if (diaYaPaso) {
                        // 🔒 MODALIDAD CONGELADO / GRIS (Muestra datos, no deja hacer clic)
                        card.onclick = null; // Quitamos el clic por completo
                        txtTitulo.className = "font-bold text-gray-400";
                        info.className = "space-y-1 text-sm text-gray-400";
                        
                        card.className = "border-2 border-gray-200 bg-gray-100 p-4 rounded-lg cursor-not-allowed shadow-inner";
                        badge.className = "text-xs bg-gray-200 text-gray-500 px-2 py-0.5 rounded-full font-semibold";
                        
                        if (pcsUsadas === 0 && tvsUsadas === 0) {
                            badge.innerText = "Libre";
                            info.innerHTML = `<p class="text-xs italic text-gray-400">Nadie reservó este módulo</p>`;
                        } else {
                            badge.innerText = "Cerrado";
                            info.innerHTML = renglonesHtml; // Se listan los cursos de forma grisácea
                        }

                    } else {
                        // 🟢 MODALIDAD ACTIVO (Permite interactuar y tiene colores vivos)
                        card.onclick = () => abrirModalSemanal(dia, mod); // Reactivamos clic
                        txtTitulo.className = "font-bold text-gray-800";
                        info.className = "space-y-1 text-sm text-gray-700";

                        if (pcsUsadas === 0 && tvsUsadas === 0) {
                            card.className = "border-2 border-green-500 bg-green-50 p-4 rounded-lg cursor-pointer hover:bg-green-100 transition shadow-sm";
                            badge.className = "text-xs bg-green-200 text-green-800 px-2 py-0.5 rounded-full font-semibold";
                            badge.innerText = "Todo Libre";
                            info.innerHTML = `<p class="text-xs text-gray-500">💻 Disponibles: ${STOCK_MAX_PC} PCs | 📺 TVs: 3</p>`;
                        } else if (pcsLibres <= 0 && tvsLibres <= 0) {
                            card.className = "border-2 border-red-500 bg-red-50 p-4 rounded-lg cursor-pointer hover:bg-red-100 transition shadow-sm opacity-90";
                            badge.className = "text-xs bg-red-200 text-red-800 px-2 py-0.5 rounded-full font-semibold";
                            badge.innerText = "Módulo Agotado";
                            info.innerHTML = renglonesHtml;
                        } else {
                            card.className = "border-2 border-orange-500 bg-orange-50 p-4 rounded-lg cursor-pointer hover:bg-orange-100 transition shadow-sm";
                            badge.className = "text-xs bg-orange-200 text-orange-800 px-2 py-0.5 rounded-full font-semibold";
                            badge.innerText = `Quedan ${pcsLibres} PCs / ${tvsLibres} TVs`;
                            info.innerHTML = renglonesHtml;
                        }
                    }
                });
            });
        });

        // 🔓 ABRIR MODAL
        window.abrirModalSemanal = function(dia, mod) {
            diaActual = dia;
            moduloActual = mod;
            const numMod = mod === "modulo1" ? "1° Módulo" : mod === "modulo2" ? "2° Módulo" : "3° Módulo";
            document.getElementById("modalTitulo").innerText = `Gestionar: ${dia.toUpperCase()} - ${numMod}`;

            let pcsUsadas = 0;
            let tvsUsadas = 0;
            const divLista = document.getElementById("listaReservasActuales");
            divLista.innerHTML = "";

            if (estadoGlobalSemana[dia] && estadoGlobalSemana[dia][mod]) {
                Object.keys(estadoGlobalSemana[dia][mod]).forEach(key => {
                    const res = estadoGlobalSemana[dia][mod][key];
                    if (!res || !res.curso || !res.tipo) return;

                    if (res.tipo === "PC") pcsUsadas += res.cantidad || 0;
                    if (res.tipo === "TV") tvsUsadas += res.cantidad || 0;

                    divLista.innerHTML += `
                        <div class="flex justify-between items-center bg-white p-2 rounded border shadow-xs">
                            <span>🎓 <b>${res.curso} (${res.division || ''})</b> pidió ${res.cantidad} ${res.tipo}/s</span>
                            <button type="button" onclick="eliminarReservaIndividual('${dia}', '${mod}', '${key}')" class="text-xs bg-red-100 text-red-700 font-bold px-2 py-1 rounded hover:bg-red-200">❌ Quitar</button>
                        </div>
                    `;
                });
            } else {
                divLista.innerHTML = '<p class="text-xs text-gray-400 italic">No hay recursos reservados todavía.</p>';
            }

            let pcsLibres = STOCK_MAX_PC - pcsUsadas;
            let tvsLibres = STOCK_MAX_TV - tvsUsadas;

            const selectRecurso = document.getElementById("recursoSelect");
            selectRecurso.innerHTML = '<option value="">Seleccionar recurso...</option>';

            if (pcsLibres > 0) {
                for (let i = 1; i <= pcsLibres; i++) {
                    selectRecurso.innerHTML += `<option value="PC-${i}">💻 Llevar ${i} Computadora${i > 1 ? 's' : ''} (Quedan ${pcsLibres})</option>`;
                }
            } else {
                selectRecurso.innerHTML += `<option value="" disabled class="text-red-500 font-semibold">❌ Computadoras Agotadas</option>`;
            }

            if (tvsLibres > 0) {
                for (let i = 1; i <= tvsLibres; i++) {
                    selectRecurso.innerHTML += `<option value="TV-${i}">📺 Llevar ${i} Televisor${i > 1 ? 'es' : ''} (Quedan ${tvsLibres})</option>`;
                }
            } else {
                selectRecurso.innerHTML += `<option value="" disabled class="text-red-500 font-semibold">❌ Televisores Agotados</option>`;
            }

            document.getElementById("miModal").classList.remove("hidden");
        };

        // 🗑️ ELIMINAR RESERVA INDIVIDUAL
        window.eliminarReservaIndividual = function(dia, mod, keyId) {
            if (confirm("¿Querés cancelar esta reserva específica?")) {
                remove(ref(db, `reservas/${dia}/${mod}/${keyId}`)).then(() => {
                    window.abrirModalSemanal(dia, mod);
                });
            }
        };

        window.cerrarModal = function() {
            document.getElementById("miModal").classList.add("hidden");
            document.getElementById("formReserva").reset();
        };
        document.getElementById("btnCancelar").onclick = cerrarModal;

        document.getElementById("formReserva").onsubmit = function(event) {
            event.preventDefault();
            const cursoVal = document.getElementById("inputCurso").value;
            const divisionVal = document.getElementById("inputDivision").value;
            const recursoVal = document.getElementById("recursoSelect").value;

            if (!recursoVal) return;
            const [tipoRecurso, cantRecurso] = recursoVal.split("-");

            push(ref(db, `reservas/${diaActual}/${moduloActual}`), {
                curso: cursoVal,
                division: divisionVal,
                tipo: tipoRecurso,
                cantidad: parseInt(cantRecurso)
            }).then(() => {
                cerrarModal();
            });
        };

        // 🔄 REINICIAR SEMANA
        document.getElementById("btnLimpiarSemana").onclick = function() {
            if (confirm("⚠️ ¡ATENCIÓN ADMINISTRADORAS!\n¿Estás segura de que querés borrar TODAS las reservas de la semana para arrancar de cero?")) {
                remove(ref(db, "reservas")).then(() => {
                    alert("¡Semana reiniciada con éxito!");
                    document.getElementById("btnLimpiarSemana").classList.add("hidden");
                });
            }
        };

        // 🤫 TRIPLE CLIC
        let conteoClics = 0;
        let timerClics;
        document.getElementById("tituloSecreto").onclick = function() {
            conteoClics++;
            clearTimeout(timerClics);
            
            if (conteoClics === 3) {
                const btn = document.getElementById("btnLimpiarSemana");
                if (btn.classList.contains("hidden")) {
                    btn.classList.remove("hidden");
                } else {
                    btn.classList.add("hidden");
                }
                conteoClics = 0;
            }
            timerClics = setTimeout(() => { conteoClics = 0; }, 500);
        };
    </script>
</body>
</html>
